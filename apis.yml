name: DWL
description: 'DWL Inc. was an enterprise software company founded in 1996 and headquartered
  in Atlanta, Georgia, with significant engineering and operations in Toronto, Ontario.
  DWL built customer data integration (CDI) middleware — its flagship product, DWL
  Customer, was a real-time master data hub that consolidated fragmented customer records
  from across banking, insurance, telecommunications, and retail systems into a single
  authoritative view, and served that view back to operational applications through
  a transaction-oriented services layer. Backed by Insight Venture Partners, AGF Investments,
  Nationwide Mutual Capital, Royal Trust, and Stone Point Capital, DWL was acquired
  by IBM in August 2005 to fill the CDI gap in IBM''s information-management stack.
  DWL Customer was rebranded IBM WebSphere Customer Center and subsequently folded
  into IBM InfoSphere Master Data Management. DWL has not operated as an independent
  company for two decades, never published a public developer program or API, and the
  dwl.com domain now redirects to ibm.com. This profile is retained as a historical
  record; there is no API surface to enrich.'
